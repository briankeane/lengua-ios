name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    env:
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install tools
        run: brew install xcodegen swiftlint swift-format

      - name: Generate project
        run: xcodegen generate

      - name: Cache SPM packages & build products
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: derived-xcode16.4-${{ hashFiles('project.yml') }}
          restore-keys: |
            derived-xcode16.4-

      - name: Lint
        run: swiftlint --strict

      - name: Format check
        run: swift-format lint --strict --recursive Lengua LenguaTests

      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/^[[:space:]]*([^(]+) \(.*/\1/' | xargs)
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          xcodebuild test \
            -project Lengua.xcodeproj -scheme Lengua \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -skipMacroValidation -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
