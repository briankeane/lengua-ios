name: Lengua
options:
  bundleIdPrefix: com.lengua-app
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configs:
  Debug: debug
  Staging: release
  Release: release

packages:
  Dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: "1.9.2"
  Sharing:
    url: https://github.com/pointfreeco/swift-sharing
    from: "2.5.2"
  IdentifiedCollections:
    url: https://github.com/pointfreeco/swift-identified-collections
    from: "1.1.0"
  CustomDump:
    url: https://github.com/pointfreeco/swift-custom-dump
    from: "1.3.3"
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: "5.10.2"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.44.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  ConcurrencyExtras:
    url: https://github.com/pointfreeco/swift-concurrency-extras
    from: "1.1.0"

targets:
  Lengua:
    type: application
    platform: iOS
    sources:
      - path: Lengua
    configFiles:
      Debug: Lengua/Config/Secrets-Local.xcconfig
      Staging: Lengua/Config/Secrets-Staging.xcconfig
      Release: Lengua/Config/Secrets.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Lengua/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.lengua-app.lengua
        PRODUCT_NAME: Lengua
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_TESTABILITY: YES
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.lengua-app.lengua.staging
    dependencies:
      - package: Dependencies
        product: Dependencies
      - package: Dependencies
        product: DependenciesMacros
      - package: Sharing
        product: Sharing
      - package: IdentifiedCollections
        product: IdentifiedCollections
      - package: CustomDump
        product: CustomDump
      - package: Alamofire
        product: Alamofire
      - package: Sentry
        product: Sentry
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

  LenguaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LenguaTests
    dependencies:
      - target: Lengua
      - package: Dependencies
        product: Dependencies
        link: false
      - package: Sharing
        product: Sharing
        link: false
      - package: CustomDump
        product: CustomDump
        link: false
      - package: ConcurrencyExtras
        product: ConcurrencyExtras
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lengua-app.lengua.LenguaTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lengua:
    build:
      targets:
        Lengua: all
        LenguaTests: [test]
    test:
      targets:
        - LenguaTests
      gatherCoverageData: false
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
